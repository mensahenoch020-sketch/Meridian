name: Meridian checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -m compileall -q server.py banking.py tests
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/extras.js
      - name: Integration tests
        run: python -m unittest discover -s tests -v
      - name: Install browser testing tools
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Mobile browser flows
        run: python tests/browser_smoke.py
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-interface
          path: artifacts/
