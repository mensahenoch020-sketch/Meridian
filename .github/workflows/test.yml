name: Meridian checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -m compileall -q server.py banking.py tests
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/extras.js
      - name: Integration tests
        run: python -m unittest discover -s tests -v
      - name: Railway container startup
        run: |
          docker build -t meridian-ci .
          docker run -d --name meridian-ci -e PORT=8080 -e ADMIN_PASSWORD=ContainerTestPassword123! -p 127.0.0.1:8080:8080 meridian-ci
          trap 'docker logs meridian-ci; docker rm -f meridian-ci' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Install browser testing tools
        timeout-minutes: 5
        run: |
          pip install playwright==1.56.0
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: Mobile browser flows
        run: python tests/browser_smoke.py
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-interface
          path: artifacts/
